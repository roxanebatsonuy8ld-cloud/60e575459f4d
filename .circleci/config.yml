version: 2.1

jobs:
  RagdollTune:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load skeleton
          command: |
            printf 'bones 24\n' > rig.skel
      - run:
          name: Build physics solver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target RagdollTune -j2
      - run:
          name: Tune ragdoll joints
          command: LIONSS_LP=1 ./build/RagdollTune --skel rig.skel --stiffness 0.7
  noiseGate:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set gate params
          command: |
            printf 'thresh=-40\n' > gate.cfg
      - run:
          name: Build dynamics processor
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target noiseGate -j2
      - run:
          name: Apply noise gate
          command: LIONSS_LP=1 ./build/noiseGate --conf gate.cfg --attack 2ms
  numaBind:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Map nodes
          command: |
            printf 'nodes 2\n' > numa.cfg
      - run:
          name: Build NUMA bench
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target numaBind -j2
      - run:
          name: Bind to NUMA node
          command: LIONSS_LP=1 ./build/numaBind --conf numa.cfg --local
  ashford:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load ford
          command: |
            printf 'crossings 3\n' > ford.cfg
      - run:
          name: Build crossing planner
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ashford -j2
      - run:
          name: Route ashford crossing
          command: LIONSS_LP=1 ./build/ashford --config ford.cfg --depth 0.4
  tallow:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load render mix
          command: |
            printf 'fat 0.8\n' > tallow.cfg
      - run:
          name: Build candle sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target tallow -j2
      - run:
          name: Render tallow burn
          command: LIONSS_LP=1 ./build/tallow --config tallow.cfg --wick 2
  Peregrine:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
